name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build jar
        run: mvn clean package -DskipTests

      - name: Prepare SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload jar
        shell: bash
        run: |
          SSH_OPTS=(
            -i ~/.ssh/id_ed25519
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          ssh "${SSH_OPTS[@]}" \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "echo ssh-ready"

          for attempt in {1..5}; do
            if scp -v \
              "${SSH_OPTS[@]}" \
              -P "${{ secrets.SERVER_PORT }}" \
              target/chen404bac-1.0.0.jar \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/deploy/chen404bac.jar"; then
              exit 0
            fi
            echo "scp upload failed on attempt ${attempt}/5; retrying in 10 seconds..."
            sleep 10
          done

          echo "scp upload failed after 5 attempts" >&2
          exit 1

      - name: Deploy backend
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "/srv/chen404/scripts/deploy-backend.sh /home/deploy/chen404bac.jar"
