# 本地 / 开发（默认 profile）。可用环境变量覆盖，见 deploy/env.dev.example
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${CHEN404_DB_HOST:127.0.0.1}:${CHEN404_DB_PORT:3306}/chen404?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${CHEN404_DB_USER:root}
    password: ${CHEN404_DB_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: Chen404HikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  data:
    redis:
      host: ${CHEN404_REDIS_HOST:127.0.0.1}
      port: ${CHEN404_REDIS_PORT:6379}
      password: ${CHEN404_REDIS_PASSWORD:}
      database: 0
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  mail:
    host: ${SPRING_MAIL_HOST:smtp.163.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    default-encoding: UTF-8
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:chen404}
  external-url: ${MINIO_EXTERNAL_URL:}

jwt:
  secret: ${JWT_SECRET:dev-change-me-in-local-env}
  expiration: ${JWT_EXPIRATION:7200000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  backend-base-url: ${APP_BACKEND_BASE_URL:http://localhost:10404/api}

logging:
  level:
    com.chen404: debug
    com.chen404.interceptor: debug
