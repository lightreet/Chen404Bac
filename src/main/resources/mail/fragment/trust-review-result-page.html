<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{pageTitle}}</title>
</head>
<body style="margin:0; font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background: radial-gradient(circle at top, #fff9fb 0%, #fcfbfd 42%, #f6f5fb 100%); padding: 24px; color: #1f2937;">
  <div style="max-width: 560px; margin: 0 auto;">
    <div style="margin-bottom: 18px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;">
        <tr>
          <td style="width:64px; vertical-align:middle; padding-right:12px;">{{brandVisual}}</td>
          <td style="vertical-align:middle; text-align:left;">
            <div style="font-size:18px; line-height:1.25; color:#5b475c; font-weight:800;">{{siteName}}</div>
            <div style="margin-top:4px; font-size:12px; line-height:1.7; color:#9a8899;">{{siteDescription}}</div>
          </td>
        </tr>
      </table>
      <div style="margin-top:14px; height:1px; background:linear-gradient(90deg, rgba(227,198,215,0), rgba(227,198,215,0.92) 20%, rgba(227,198,215,0.92) 80%, rgba(227,198,215,0));"></div>
    </div>
    <div style="background:#ffffff; border:1px solid rgba(224,197,212,0.36); border-radius:24px; padding:32px 24px; box-shadow:0 16px 42px rgba(102,83,112,0.08); text-align: center;">
      <div style="display: inline-block; min-width: 92px; padding: 7px 16px; border-radius: 999px; background: {{badgeColor}}; color: #ffffff; font-size: 13px; font-weight: 700;">{{badgeText}}</div>
      <h2 style="margin: 18px 0 10px; font-size: 28px; line-height: 1.25; color: #241b2f;">{{resultTitle}}</h2>
      <p style="margin: 0; line-height: 1.85; color: #64576b; font-size: 15px;">{{resultMessage}}</p>
    </div>
  </div>
</body>
</html>
