<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background:linear-gradient(180deg, #fff9fc 0%, #fff3f8 48%, #fffafc 100%); font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; color:#2f2434;">
  <div style="padding:24px 12px 40px;">
    <div style="max-width:640px; margin:0 auto;">
      <div style="text-align:center; margin-bottom:18px;">{{brandVisual}}</div>
      <div style="text-align:center; margin-bottom:20px;">
        <div style="display:inline-block; padding:6px 12px; border-radius:999px; background:rgba(245,155,188,0.14); color:#d85f8f; font-size:12px; font-weight:700; letter-spacing:0.08em;">{{mailEyebrow}}</div>
        <h1 style="margin:14px 0 8px; font-size:30px; line-height:1.2; color:#2c2031;">{{mailTitle}}</h1>
        <p style="margin:0; color:#8c758a; font-size:14px; line-height:1.8;">{{siteName}} · {{siteDescription}}</p>
      </div>

      <div style="background:rgba(255,255,255,0.94); border:1px solid rgba(245,155,188,0.14); border-radius:30px; box-shadow:0 20px 48px rgba(229,151,181,0.14); overflow:hidden;">
        <div style="padding:34px 30px 18px;">
          <p style="margin:0 0 14px; color:#5d4b5d; font-size:15px; line-height:1.9;">{{mailLead}}</p>
          <div style="margin:24px 0 18px; padding:24px 18px; border-radius:24px; background:linear-gradient(135deg, rgba(255,243,248,0.95), rgba(255,250,252,0.98)); border:1px solid rgba(245,155,188,0.16); text-align:center;">
            <div style="font-size:13px; color:#a97c96; letter-spacing:0.16em; text-transform:uppercase; margin-bottom:10px;">Verification Code</div>
            <div style="font-size:36px; line-height:1; letter-spacing:0.3em; font-weight:800; color:#d85f8f;">{{codeValue}}</div>
          </div>
          <div style="margin-top:16px; padding:16px 18px; border-radius:20px; background:rgba(250,247,250,0.88); color:#6f5a6f; font-size:14px; line-height:1.8;">
            {{actionHint}}
          </div>
        </div>
        <div style="padding:18px 30px 28px; color:#9e8a9d; font-size:12px; line-height:1.9; border-top:1px solid rgba(245,155,188,0.10);">
          <div>{{ignoreHint}}</div>
          <div style="margin-top:8px;">此邮件由 {{siteName}} 自动发送，请勿直接回复。</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
