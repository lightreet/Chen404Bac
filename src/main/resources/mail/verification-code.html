<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background:radial-gradient(circle at top, #fff9fb 0%, #fcfbfd 46%, #f7f6fb 100%); font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; color:#2d2432;">
  <div style="padding:18px 8px 28px;">
    <div style="max-width:560px; margin:0 auto;">
      <div style="margin-bottom:18px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;">
          <tr>
            <td style="width:64px; vertical-align:middle; padding-right:12px;">{{brandVisual}}</td>
            <td style="vertical-align:middle; text-align:left;">
              <div style="font-size:18px; line-height:1.25; color:#5b475c; font-weight:800; letter-spacing:0.01em;">{{siteName}}</div>
              <div style="margin-top:4px; font-size:12px; line-height:1.7; color:#9a8899;">{{siteDescription}}</div>
            </td>
          </tr>
        </table>
        <div style="margin-top:14px; height:1px; background:linear-gradient(90deg, rgba(227,198,215,0), rgba(227,198,215,0.92) 20%, rgba(227,198,215,0.92) 80%, rgba(227,198,215,0));"></div>
      </div>

      <div style="background:rgba(255,255,255,0.97); border:1px solid rgba(224,197,212,0.52); border-radius:22px; box-shadow:0 16px 42px rgba(102,83,112,0.08); overflow:hidden;">
        <div style="padding:22px 18px 18px;">
          <div style="display:inline-block; padding:5px 10px; border-radius:999px; background:rgba(214,110,150,0.10); color:#c15c88; font-size:11px; font-weight:700; letter-spacing:0.08em;">{{mailEyebrow}}</div>
          <h1 style="margin:10px 0 8px; font-size:28px; line-height:1.18; color:#241b2f; font-weight:800;">{{mailTitle}}</h1>
          <p style="margin:0; color:#6a596d; font-size:14px; line-height:1.8;">{{mailLead}}</p>

          <div style="margin:18px 0 16px; border-top:1px dashed rgba(214,110,150,0.25);"></div>

          <div style="margin:24px 0 18px; padding:24px 18px; border-radius:18px; background:rgba(255,249,251,0.96); border:1px solid rgba(224,197,212,0.42); text-align:center;">
            <div style="font-size:13px; color:#a97c96; letter-spacing:0.16em; text-transform:uppercase; margin-bottom:10px;">Verification Code</div>
            <div style="font-size:36px; line-height:1; letter-spacing:0.3em; font-weight:800; color:#d85f8f;">{{codeValue}}</div>
          </div>

          <div style="margin-top:16px; padding:14px 14px; border-radius:18px; background:linear-gradient(135deg, rgba(250,247,250,0.96), rgba(255,251,252,0.98)); border:1px solid rgba(224,197,212,0.34); color:#6f5e72; font-size:13px; line-height:1.8;">
            {{actionHint}}
          </div>
        </div>

        <div style="padding:18px 18px 24px; color:#9a8c9d; font-size:12px; line-height:1.9; border-top:1px solid rgba(224,197,212,0.20);">
          <div>{{ignoreHint}}</div>
          <div style="margin-top:8px;">此邮件由 {{siteName}} 自动发送，请勿直接回复。</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
