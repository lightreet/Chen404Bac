server:
  port: 10404
  servlet:
    context-path: /api

spring:
  application:
    name: chen404bac
  profiles:
    default: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 150MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    baseline-on-migrate: true
    baseline-version: 2026042502
    validate-on-migrate: true
    clean-disabled: true

# 逗号分隔；生产环境由 application-prod 中 APP_CORS_ALLOWED_ORIGINS 覆盖
app:
  cors:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173,http://192.168.1.6:5173"
  frontend-base-url: "http://localhost:5173"
  backend-base-url: "http://localhost:10404/api"
  site-runtime:
    article-page-size: 10
    upload-max-size: 12582912
    upload-allow-types:
      - jpg
      - jpeg
      - png
      - gif
      - webp
      - bmp
  # 上传图片压缩为 WebP（动图 GIF 不处理）；依赖 webp-imageio 自带 win/linux/mac x64 原生库
  image-processing:
    enabled: true
    webp-quality: 82
    lossless-webp-for-alpha: false
    max-edge-article-content: 1920
    max-edge-article-cover: 1600
    avatar-size: 512
  ai:
    runtime:
      chat:
        enabled: true
        max-citation-count: 3
        max-context-messages: 8
        max-article-content-chars: 3000
        max-article-summary-chars: 300
        max-suggestion-count: 3
        related-article-limit: 2
        require-recommend-intent-for-related-articles: true
      article-assist:
        enabled: true
        max-input-chars: 12000
        max-summary-length: 180
        preferred-tag-count: 3
        max-tag-count: 5
      recommend:
        enabled: true
        default-limit: 3
        scan-limit: 30
    maid:
      name: ${APP_AI_MAID_NAME:Lyra}
      persona-version: ${APP_AI_MAID_PERSONA_VERSION:v1.1}
      system-prompt-location: ${APP_AI_MAID_SYSTEM_PROMPT_LOCATION:classpath:prompts/ai/maid-system-prompt.txt}
      helper-task-prompt-location: ${APP_AI_MAID_HELPER_TASK_PROMPT_LOCATION:classpath:prompts/ai/maid-helper-task-prompt.txt}
      companion-task-prompt-location: ${APP_AI_MAID_COMPANION_TASK_PROMPT_LOCATION:classpath:prompts/ai/maid-companion-task-prompt.txt}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.chen404.domain.entity

logging:
  config: classpath:logback-spring.xml
  level:
    root: info
    com.chen404: info
    com.chen404.interceptor: info
    org.springframework.security: error
    org.springframework.web: warn
    org.springframework.jdbc: warn
    com.baomidou.mybatisplus: warn

llm:
  enabled: ${LLM_ENABLED:false}
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  model: ${LLM_MODEL:gpt-5.4-mini}
  api-style: ${LLM_API_STYLE:chat-completions}
  chat-completions-path: ${LLM_CHAT_COMPLETIONS_PATH:/chat/completions}
  responses-path: ${LLM_RESPONSES_PATH:/responses}
  temperature: ${LLM_TEMPERATURE:0.2}
  max-tokens: ${LLM_MAX_TOKENS:512}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:30}
