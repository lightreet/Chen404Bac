server:
  port: 10404
  servlet:
    context-path: /api

spring:
  application:
    name: chen404bac
  profiles:
    default: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 150MB

# 逗号分隔；生产环境由 application-prod 中 APP_CORS_ALLOWED_ORIGINS 覆盖
app:
  cors:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173,http://192.168.1.6:5173"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.chen404.domain.entity

logging:
  config: classpath:logback-spring.xml
  level:
    root: info
    com.chen404: info
    com.chen404.interceptor: info
    org.springframework.security: error
    org.springframework.web: warn
    org.springframework.jdbc: warn
    com.baomidou.mybatisplus: warn
